# claudeplay config: copy to ~/.claudeplay/config.yaml and fill in (CLAUDEPLAY_HOME changes the folder).
# this file holds secrets once filled in; it lives outside the repo and is never committed.
# `claudeplay check` prints it with every secret masked, for debugging.
#
# values are written directly. ${NAME} is also accepted anywhere and is replaced (in memory only)
# with the environment variable NAME when the value is used (quote it inside [ ] lists). unknown keys
# are errors.
# toolkit.yaml, next to this file, says which of each server's tools claude sees.

gateway:
  host: 127.0.0.1
  port: 8765
  # public https url once the tunnel exists; leave as localhost for local use
  public_base_url: http://localhost:8765
  # local use without login while auth is not filled in; refused unless host is 127.0.0.1.
  # refused while a tunnel is enabled.
  # insecure_no_auth: true

# the tray runs this named tunnel next to the gateway. create it once with:
#   cloudflared tunnel login
#   cloudflared tunnel create claudeplay
#   cloudflared tunnel route dns claudeplay <hostname>
# then copy the <tunnel-id>.json it wrote (and nothing else) into ~/.claudeplay/cloudflared, and set
# public_base_url above to https://<hostname>. leave this out for local use.
# tunnel:
#   name: claudeplay
#   command: C:/Program Files (x86)/cloudflared/cloudflared.exe
#   # the credentials default to the one .json in ~/.claudeplay/cloudflared
#   # credentials_file: C:/somewhere/<tunnel-id>.json

auth:
  # github oauth app (Settings > Developer settings > OAuth Apps)
  client_id: ''
  client_secret: ''
  # numeric github user id(s) allowed in: https://api.github.com/users/<login> -> "id"
  allowed_user_ids: [0]
  # jwt_signing_key is generated and written here on first run; changing it logs out every client

servers:
  obsidian:
    command: C:/Users/<you>/.local/bin/obsidian-mcp.exe
    args: [--vault, C:/path/to/vault]
    enabled: true
    # "today" follows the laptop's time zone; set TZ here only to override it
    # env: {TZ: America/New_York}

  pinboard:
    command: C:/Users/<you>/.local/bin/pinboard-mcp.exe
    # pinboard-mcp checks its token at startup and exits if it is wrong
    enabled: false
    env:
      # pinboard.in settings > password > api token, format username:TOKEN
      PINBOARD_TOKEN: ''

  windows:
    # gives whoever signs in a shell and full file access on this pc, as you. pinned, so a public connector
    # does not pull new code on every start.
    command: C:/Users/<you>/.local/bin/uvx.exe
    args: [windows-mcp==0.8.7, serve]
    enabled: false
    env:
      ANONYMIZED_TELEMETRY: 'false'
