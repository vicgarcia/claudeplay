# claudeplay config: copy to %LOCALAPPDATA%\claudeplay\config.toml and fill in.
# this file holds secrets once filled in; it lives outside the repo and is never committed.
# `claudeplay check` prints it with every secret masked, for debugging.
#
# values are written directly. ${NAME} is also accepted anywhere and is replaced (in memory only)
# with the environment variable NAME when the value is used.

[gateway]
host = '127.0.0.1'
port = 8765
# public https url once the tunnel exists; leave as localhost for local use
public_base_url = 'http://localhost:8765'
# local use without login while [auth] is not filled in; refused unless host is 127.0.0.1.
# refused while a [tunnel] is enabled.
# insecure_no_auth = true

# the tray runs this named tunnel next to the gateway. create it once with:
#   cloudflared tunnel login
#   cloudflared tunnel create claudeplay
#   cloudflared tunnel route dns claudeplay <hostname>
# then set public_base_url above to https://<hostname>. leave this out for local use.
# [tunnel]
# name = 'claudeplay'
# command = 'C:/Program Files (x86)/cloudflared/cloudflared.exe'

[auth]
# github oauth app (Settings > Developer settings > OAuth Apps)
client_id = ''
client_secret = ''
# numeric github user id(s) allowed in: https://api.github.com/users/<login> -> "id"
allowed_user_ids = [0]
# jwt_signing_key is generated and written here on first run; changing it logs out every client

[servers.obsidian]
command = 'C:/Users/<you>/.local/bin/obsidian-mcp.exe'
args = ['--vault', 'C:/path/to/vault']
enabled = true

# "today" follows the laptop's time zone; set TZ here only to override it
# [servers.obsidian.env]
# TZ = 'America/New_York'

[servers.todo]
# python.exe, not todo-mcp.exe: smart app control blocks the uv launcher stub
command = 'C:/Users/<you>/AppData/Roaming/uv/tools/todo-mcp/Scripts/python.exe'
args = ['-c', 'from todo_mcp.server import run; run()']
enabled = false

[servers.todo.env]
# azure app id and secret; refresh token from `todo-mcp --auth --client-id ... --client-secret ...`
TODO_CLIENT_ID = ''
TODO_CLIENT_SECRET = ''
TODO_REFRESH_TOKEN = ''

# your own task lists: the ids of common_lists are published in the tasks_get_lists description, and
# due_today names the main lists, which tasks_get_due_today and tasks_get_completed_between use. get the ids from the tasks_get_lists tool.
# [tasks]
# due_today = ['Tasks', 'Chores']
# [tasks.common_lists]
# Tasks = '<list id>'
# Chores = '<list id>'
# Grocery = '<list id>'

# web_fetch's browser. leave this out for edge.
# [browser]
# channel = 'msedge'   # or 'chrome', or 'chromium' after `playwright install chromium`

[servers.pinboard]
# python.exe, not pinboard-mcp.exe: smart app control blocks the uv launcher stub
command = 'C:/Users/<you>/AppData/Roaming/uv/tools/pinboard-mcp/Scripts/python.exe'
args = ['-c', 'from pinboard_mcp import run; run()']
# pinboard-mcp checks its token at startup and exits if it is wrong
enabled = false

[servers.pinboard.env]
# pinboard.in settings > password > api token, format username:TOKEN
PINBOARD_TOKEN = ''

[servers.windows]
# gives whoever signs in a shell and full file access on this pc, as you. pinned, so a public connector
# does not pull new code on every start.
command = 'C:/Users/<you>/.local/bin/uvx.exe'
args = ['windows-mcp==0.8.7', 'serve']
enabled = false

[servers.windows.env]
ANONYMIZED_TELEMETRY = 'false'
