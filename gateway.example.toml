# copy to %LOCALAPPDATA%\claudeplay\gateway.toml (or point CLAUDEPLAY_CONFIG at it) and edit.
# ${ENV_VAR} references in command, args and env values are expanded from the environment
# when a server starts. keep real secrets in user environment variables, never in this file.

[gateway]
host = '127.0.0.1'
port = 8765
# public https url once the tunnel exists; leave empty for local development
public_base_url = 'http://localhost:8765'

[auth]
# github oauth app credentials, and the only github account allowed in (numeric id, not login)
client_id = '${CLAUDEPLAY_GITHUB_CLIENT_ID}'
client_secret = '${CLAUDEPLAY_GITHUB_CLIENT_SECRET}'
# any long random string; signs the tokens this gateway issues
jwt_signing_key = '${CLAUDEPLAY_JWT_KEY}'
allowed_user_ids = [0]

[servers.obsidian]
command = '${USERPROFILE}/.local/bin/obsidian-mcp.exe'
args = ['--vault', 'C:/path/to/vault']
enabled = true

[servers.obsidian.env]
TZ = 'America/New_York'

[servers.todo]
command = '${USERPROFILE}/.local/bin/todo-mcp.exe'
# todo-mcp reads these three from its environment, so no secrets appear on its command line
enabled = false

[servers.todo.env]
TODO_CLIENT_ID = '${TODO_CLIENT_ID}'
TODO_CLIENT_SECRET = '${TODO_CLIENT_SECRET}'
TODO_REFRESH_TOKEN = '${TODO_REFRESH_TOKEN}'

[servers.pinboard]
command = '${USERPROFILE}/.local/bin/pinboard-mcp.exe'
# pinboard-mcp validates its token at startup and exits if it is wrong, so this stays off until
# PINBOARD_TOKEN is set (format username:TOKEN)
enabled = false

[servers.pinboard.env]
PINBOARD_TOKEN = '${PINBOARD_TOKEN}'
